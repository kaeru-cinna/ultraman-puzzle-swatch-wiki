<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パズシュワ ダメージ計算</title>
  <meta name="description" content="ウルトラマンパズルシュワッチ パズシュワ 攻略 まとめ 襲来 ダメージ 計算">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2529205461735673"
     crossorigin="anonymous"></script>
</head>
<body>

<!-- 共通ヘッダー -->
<div id="header"></div>

<p class="notice">
※当サイトは非公式ファン攻略サイトです。
</p>

<div class="container">

  <!-- 共通目次 -->
  <div id="toc-area"></div>

  <!-- メイン -->
  <main>
    <div id="score-calculator">

  <h1 id="score-title">ダメージ計算</h1>
  <a href="DamageCalculation.html">スコア計算はこちら</a>
  <a href="DamageCalculationOTS.html">OTSはこちら</a>
  
  <div class="score-row">
    ダメージ上限補正
    <input type="number" id="upperLimit">
  </div>

  <div class="score-row">
    ボム攻撃力
    <input type="number" id="bombAttack">
  </div>

  <div class="score-row">
    敵防御力
    <input type="number" id="enemyDefense">
  </div>

  <hr>

  <form id="scoreForm">
  
    <div class="score-row">
      <input type="checkbox" id="damage6Enable" checked>
      ステージバフ(〇〇〇〇%)
      <input type="number" id="stageGimmick">
    </div>
    <div class="score-row">
      <input type="checkbox" id="damage1Enable" checked>
      ダメージアップ1
      <input type="number" id="v1">
    </div>
    <div class="score-row">
      <input type="checkbox" id="damage2Enable" checked>
      ダメージアップ2
      <input type="number" id="v2">
    </div>
    <div class="score-row">
      <input type="checkbox" id="damage3Enable" checked>
      ダメージアップ3 
      <input type="number" id="v3">
    </div>
    <div class="score-row">
      <input type="checkbox" id="damage4Enable" checked>
      ダメージアップ4
      <input type="number" id="v4">
    </div>
    <div class="score-row">
      <input type="checkbox" id="damage5Enable" checked>
      ダメージアップ5
      <input type="number" id="v5">
    </div>

    <button type="submit" id="damage-button">計算する</button>

  </form>

  <div id="damage-result">最終スコア: 0</div>

</div>

  </main>

  <!-- サイドバー -->
  <aside>
    <div id="article-area"></div>
  </aside>

</div>

<footer>
  © ウルトラマンパズルシュワッチ攻略まとめ
</footer>

<script src="Damage.js" defer></script>
<script src="include.js" defer></script>
</body>
</html>
